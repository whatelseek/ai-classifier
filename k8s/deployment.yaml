# IT Ticket Classifier — namespace it-classifier.
apiVersion: v1
kind: Namespace
metadata:
  name: it-classifier
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: it-ticket-classifier
  namespace: it-classifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: it-ticket-classifier
  template:
    metadata:
      labels:
        app: it-ticket-classifier
    spec:
      containers:
        - name: api
          image: ttl.sh/vexa-it-ticket-classifier:24h
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            # joey-1 on spark1, served by services/joey-qev-server. Deploy: docs/joey.md.
            - name: JOEY_SYSTEMONE_URL
              value: "http://10.70.0.121:8003/v1/systemone"
            - name: JOEY_DECISION_MODEL
              value: "joey-1"
            - name: JOEY_TIMEOUT_SECONDS
              value: "30"
            # Question and class descriptions. Edit these to change routing; restart the pod, no image rebuild.
            - name: JOEY_ROUTE_INSTRUCTIONS
              value: "Какая команда поддержки должна обработать это обращение?"
            - name: JOEY_CRITERIA_DATABASE
              value: "Базы данных и СУБД (PostgreSQL, MySQL, Oracle, MS SQL, ClickHouse): запросы, производительность, репликация, блокировки, схемы и данные в БД"
            - name: JOEY_CRITERIA_SECURITY
              value: "Информационная безопасность: антивирусная защита и вредоносное ПО, управление уязвимостями и отчёты сканеров, фишинг и почтовая безопасность, социальная инженерия, учётные записи (блокировки, подбор паролей), утечка секретов и паролей, утеря или кража устройств, доступ к системам с персональными данными, подозрительная активность на серверах"
            - name: JOEY_CRITERIA_NETWORK
              value: "Сеть: VPN и удалённый доступ, межсетевые экраны, открытие портов и сетевых доступов между сервисами, маршрутизация, DNS"
            - name: JOEY_CRITERIA_IT_INFRASTRUCTURE
              value: "ИТ-инфраструктура: серверы Linux (место на диске, нагрузка, SSH-доступ), Kubernetes, резервное копирование и восстановление файлов, корпоративная почта, TLS-сертификаты, файловые ресурсы и общие папки"
            - name: JOEY_CRITERIA_UNCLASSIFIED
              value: "Обращение не относится к ИТ-поддержке или из текста невозможно понять, в чём проблема"
            - name: MASK_INTERNAL_HOSTS
              value: "true"
            - name: MAX_CONCURRENT_REQUESTS
              value: "4"
            - name: REQUEST_TIMEOUT_SECONDS
              value: "60"
            - name: LOG_JSON
              value: "true"
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: it-ticket-classifier
  namespace: it-classifier
spec:
  selector:
    app: it-ticket-classifier
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: it-ticket-classifier
  namespace: it-classifier
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: it-classifier.apps.vexa.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: it-ticket-classifier
                port:
                  name: http
