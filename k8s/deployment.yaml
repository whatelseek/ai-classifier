# IT Ticket Classifier — namespace it-classifier, PVC for temp workspace.
apiVersion: v1
kind: Namespace
metadata:
  name: it-classifier
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: classifier-data
  namespace: it-classifier
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: cloudstack-custom
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: it-ticket-classifier
  namespace: it-classifier
type: Opaque
stringData:
  OPENAI_API_KEY: "dummy"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: it-ticket-classifier
  namespace: it-classifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: it-ticket-classifier
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: it-ticket-classifier
    spec:
      containers:
        - name: api
          image: ttl.sh/vexa-it-ticket-classifier:24h
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: it-ticket-classifier
                  key: OPENAI_API_KEY
            # joey-1 on spark1 served by the qev runtime (services/joey-qev-server), not vLLM.
            - name: JOEY_ROUTING_MODE
              value: "systemone"
            - name: JOEY_SYSTEMONE_URL
              value: "http://10.70.0.121:8003/v1/systemone"
            - name: JOEY_DECISION_MODEL
              value: "joey-1"
            # Question and class descriptions. Edit these to change routing; restart the pod, no image rebuild.
            - name: JOEY_ROUTE_INSTRUCTIONS
              value: "Какая команда поддержки должна обработать это обращение?"
            - name: JOEY_CRITERIA_DATABASE
              value: "Базы данных и СУБД (PostgreSQL, MySQL, Oracle, MS SQL, ClickHouse): запросы, производительность, репликация, блокировки, схемы и данные в БД"
            - name: JOEY_CRITERIA_SECURITY
              value: "Информационная безопасность: антивирусная защита и вредоносное ПО, управление уязвимостями и отчёты сканеров, фишинг и почтовая безопасность, социальная инженерия, учётные записи (блокировки, подбор паролей), утечка секретов и паролей, утеря или кража устройств, доступ к системам с персональными данными, подозрительная активность на серверах"
            - name: JOEY_CRITERIA_NETWORK
              value: "Сеть: VPN и удалённый доступ, межсетевые экраны, открытие портов и сетевых доступов между сервисами, маршрутизация, DNS"
            - name: JOEY_CRITERIA_IT_INFRASTRUCTURE
              value: "ИТ-инфраструктура: серверы Linux (место на диске, нагрузка, SSH-доступ), Kubernetes, резервное копирование и восстановление файлов, корпоративная почта, TLS-сертификаты, файловые ресурсы и общие папки"
            - name: JOEY_CRITERIA_UNCLASSIFIED
              value: "Обращение не относится к ИТ-поддержке или из текста невозможно понять, в чём проблема"
            # A model name containing "joey" selects the System One path.
            - name: OPENAI_TEXT_MODEL
              value: joey-1
            - name: DOCLING_API_URL
              value: http://10.70.0.121:8002
            - name: DOCLING_TIMEOUT_SECONDS
              value: "180"
            - name: OPENAI_TIMEOUT_SECONDS
              value: "180"
            - name: OPENAI_MAX_OUTPUT_TOKENS
              value: "128"
            - name: CLASSIFY_EXTRACT_REQUEST_BODY
              value: "true"
            - name: CLASSIFY_DESCRIPTION_ONLY
              value: "true"
            - name: CLASSIFICATION_SCORING_ONLY
              value: "true"
            - name: MAX_CLASSIFICATION_RETRIES
              value: "0"
            - name: MAX_CONCURRENT_REQUESTS
              value: "4"
            - name: REQUEST_TIMEOUT_SECONDS
              value: "300"
            - name: TEMP_DIR
              value: /data/tmp
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: classifier-data
---
apiVersion: v1
kind: Service
metadata:
  name: it-ticket-classifier
  namespace: it-classifier
spec:
  selector:
    app: it-ticket-classifier
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: it-ticket-classifier
  namespace: it-classifier
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "55m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: it-classifier.apps.vexa.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: it-ticket-classifier
                port:
                  name: http