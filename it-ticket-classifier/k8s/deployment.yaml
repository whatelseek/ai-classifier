# IT ticket classifier — namespace ai-classifier, PVC for Docling/HF cache + temp files.
apiVersion: v1
kind: Namespace
metadata:
  name: ai-classifier
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: classifier-data
  namespace: ai-classifier
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: cloudstack-custom
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: it-ticket-classifier
  namespace: ai-classifier
type: Opaque
stringData:
  OPENAI_API_KEY: "dummy"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: it-ticket-classifier
  namespace: ai-classifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: it-ticket-classifier
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: it-ticket-classifier
    spec:
      containers:
        - name: it-ticket-classifier
          image: ttl.sh/vexa-it-ticket-classifier:24h
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: OPENAI_BASE_URL
              value: http://envoy.apps.vexa.home/v1
            - name: OPENAI_TEXT_MODEL
              value: Joey-1-Local
            - name: OPENAI_VISION_MODEL
              value: Joey-1-Local
            - name: OPENAI_TIMEOUT_SECONDS
              value: "120"
            - name: TEMP_DIR
              value: /data/tmp
            - name: HF_HOME
              value: /data/huggingface
            - name: XDG_CACHE_HOME
              value: /data/cache
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: it-ticket-classifier
                  key: OPENAI_API_KEY
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: classifier-data
---
apiVersion: v1
kind: Service
metadata:
  name: it-ticket-classifier
  namespace: ai-classifier
spec:
  selector:
    app: it-ticket-classifier
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: it-ticket-classifier
  namespace: ai-classifier
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "55m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: classifier.apps.vexa.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: it-ticket-classifier
                port:
                  name: http