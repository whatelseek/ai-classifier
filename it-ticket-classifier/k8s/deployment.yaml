# IT Ticket Classifier — namespace it-classifier, PVC for temp workspace.
apiVersion: v1
kind: Namespace
metadata:
  name: it-classifier
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: classifier-data
  namespace: it-classifier
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: cloudstack-custom
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: it-ticket-classifier
  namespace: it-classifier
type: Opaque
stringData:
  OPENAI_API_KEY: "dummy"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: it-ticket-classifier
  namespace: it-classifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: it-ticket-classifier
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: it-ticket-classifier
    spec:
      hostAliases:
        - ip: "10.70.20.23"
          hostnames:
            - envoy.apps.vexa.home
      containers:
        - name: api
          image: ttl.sh/vexa-it-ticket-classifier:24h
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: it-ticket-classifier
                  key: OPENAI_API_KEY
            - name: OPENAI_BASE_URL
              value: http://envoy.apps.vexa.home/v1
            - name: OPENAI_TEXT_MODEL
              value: Joey-1-Local
            - name: OPENAI_VISION_MODEL
              value: Joey-1-Local
            - name: DOCLING_API_URL
              value: http://10.70.0.121:8002
            - name: DOCLING_TIMEOUT_SECONDS
              value: "180"
            - name: OPENAI_TIMEOUT_SECONDS
              value: "180"
            - name: REQUEST_TIMEOUT_SECONDS
              value: "300"
            - name: MAX_CONCURRENT_REQUESTS
              value: "20"
            - name: TEMP_DIR
              value: /data/tmp
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: classifier-data
---
apiVersion: v1
kind: Service
metadata:
  name: it-ticket-classifier
  namespace: it-classifier
spec:
  selector:
    app: it-ticket-classifier
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: it-ticket-classifier
  namespace: it-classifier
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "55m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: it-classifier.apps.vexa.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: it-ticket-classifier
                port:
                  name: http