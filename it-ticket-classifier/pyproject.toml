[project]
name = "it-ticket-classifier"
version = "0.1.0"
description = "AI-powered IT support ticket classification agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
    "openai>=1.55.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "python-magic>=0.4.27",
    "pyyaml>=6.0.2",
    "defusedxml>=0.7.1",
    "pillow>=10.4.0",
    "anyio>=4.4.0",
]

[project.optional-dependencies]
docling = [
    "docling>=2.7.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live_openai: tests requiring live OpenAI API access",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"app/api/routes.py" = ["B008"]
"app/parsers/*.py" = ["BLE001"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true